services:
  api:
    build: .
    image: flickr8k-caption-gen:latest
    ports:
      - "8000:8000"
    environment:
      - SERVICE=api
      - PORT=8000
      - HF_MODEL_REPO=${HF_MODEL_REPO:-}
    volumes:
      - ./artifacts:/app/artifacts
    restart: unless-stopped

  gradio:
    build: .
    image: flickr8k-caption-gen:latest
    ports:
      - "7860:7860"
    environment:
      - SERVICE=gradio
      - PORT=7860
      - HF_MODEL_REPO=${HF_MODEL_REPO:-}
    volumes:
      - ./artifacts:/app/artifacts
    restart: unless-stopped
