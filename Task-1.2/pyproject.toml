[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flickr8k-caption-gen"
version = "1.0.0"
description = "Image caption generator trained on Flickr8k: ResNet transfer-learning encoder + attention LSTM/GRU decoder, served via FastAPI and Gradio."
requires-python = ">=3.10"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.black]
line-length = 110

[tool.ruff]
line-length = 110
src = ["src", "scripts", "tests"]
